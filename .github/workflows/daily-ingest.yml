name: Daily ingest

# The scheduler for the whole project. Free-tier hosts have ephemeral disk and spin
# down when idle, so a cron job running there would lose the SQLite file overnight and
# silently defeat the historical-tracking feature. Running it here instead costs
# nothing, never cold-starts, and puts each day's snapshot in git history.
on:
  schedule:
    # 06:20 UTC. Not on the hour, because GitHub's shared scheduler is congested at :00
    # and delays runs by many minutes.
    - cron: "20 6 * * *"
  workflow_dispatch: {}

# Needed to push the refreshed database and JSON back to the branch.
permissions:
  contents: write

concurrency:
  # A backfill and a scheduled run writing the same SQLite file would race.
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test before ingesting
        # A broken normalizer would otherwise commit corrupt data to the repo, and the
        # committed file is what the live dashboard serves.
        run: pytest -q

      - name: Ingest
        run: treasury-dashboard ingest --source defillama

      - name: Export dashboard JSON
        run: treasury-dashboard export

      - name: Show what landed
        run: treasury-dashboard status

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasuries.sqlite frontend/public/data/dashboard.json
          # Nothing to commit is a normal outcome: a re-run on the same day updates
          # rows in place and can leave the files byte-identical.
          if git diff --staged --quiet; then
            echo "No data change today."
          else
            git commit -m "Daily snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
