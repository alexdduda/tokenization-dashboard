name: Ingest and deploy

# One workflow does the whole loop: pull today's data, commit it, build the page, and
# publish it to GitHub Pages. Kept as a single file on purpose — splitting ingest from
# deploy needs the deploy side to re-checkout the commit the ingest side just pushed,
# which races. Here the built files are already on disk from the same job.
on:
  schedule:
    # 06:20 UTC. Not on the hour: GitHub's shared scheduler is congested at :00 and
    # delays runs by many minutes.
    - cron: "20 6 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # commit the refreshed snapshot
  pages: write # publish to Pages
  id-token: write # required by deploy-pages for its OIDC handshake

concurrency:
  # A scheduled run and a push writing the same SQLite file would race, and Pages
  # rejects concurrent deployments.
  group: ingest-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Test before ingesting
        # The committed data is what the live site serves, so a broken normalizer must
        # not get the chance to publish corrupt numbers.
        run: pytest -q

      - name: Ingest
        run: treasury-dashboard ingest --source defillama

      - name: Export dashboard JSON
        run: treasury-dashboard export

      - name: Show what landed
        run: treasury-dashboard status

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasuries.sqlite frontend/public/data/dashboard.json
          # Nothing to commit is a normal outcome: a same-day re-run updates rows in
          # place and can leave both files byte-identical.
          if git diff --staged --quiet; then
            echo "No data change today."
          else
            git commit -m "Daily snapshot $(date -u +%Y-%m-%d)"
            # This push is authored by GITHUB_TOKEN, and GitHub does not trigger
            # workflows from those pushes — which is what stops this from looping.
            git push
          fi

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
